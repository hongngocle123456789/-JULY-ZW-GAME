<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Plastic Collector</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 450px;
            background-color: #5BC0EB;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            border-radius: 8px;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Overlay Screen Styles */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.92);
            z-index: 10;
            padding: 20px;
            text-align: center;
            color: #2D3436;
        }

        .screen.hidden {
            display: none !important;
        }

        h1 {
            font-size: 24px;
            color: #2D3436;
            margin-bottom: 12px;
            text-shadow: 2px 2px 0px #7BC950;
            line-height: 1.3;
        }

        h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #2D3436;
        }

        p {
            font-size: 11px;
            line-height: 1.6;
            margin: 8px 0;
            max-width: 600px;
        }

        .btn {
            background-color: #7BC950;
            color: #FFFFFF;
            border: 4px solid #5A9A3C;
            padding: 12px 24px;
            font-family: 'Press Start 2P', monospace;
            font-size: 14px;
            cursor: pointer;
            margin-top: 15px;
            border-radius: 6px;
            box-shadow: 0 4px 0 #5A9A3C;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .btn:hover {
            background-color: #8be05d;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #5A9A3C;
        }

        /* Start Screen Item Previews */
        .preview-container {
            display: flex;
            gap: 15px;
            margin: 15px 0;
            justify-content: center;
            align-items: center;
        }

        .preview-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 75px;
        }

        .preview-circle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #ffffff;
            border: 3px solid #7BC950;
            box-shadow: 0 0 8px #7BC950;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .preview-label {
            font-size: 7px;
            margin-top: 6px;
            color: #2D3436;
            text-align: center;
        }

        /* Controls hint box */
        .controls-hint {
            background: #EFEFEF;
            border: 2px solid #CCC;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 9px;
            margin-top: 12px;
        }

        /* End Screen Stats */
        .stats-box {
            background: #F7F9FA;
            border: 2px solid #DFE6E9;
            padding: 12px;
            border-radius: 6px;
            margin: 10px 0;
            width: 80%;
            max-width: 400px;
            text-align: left;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            margin: 6px 0;
        }

        .did-you-know {
            background: #E8F8F5;
            border-left: 5px solid #7BC950;
            padding: 10px;
            margin: 10px 0;
            font-size: 9px;
            line-height: 1.5;
            max-width: 500px;
            color: #117A65;
            text-align: left;
        }

        .did-you-know-title {
            font-weight: bold;
            color: #0E6251;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="450"></canvas>

    <!-- START SCREEN -->
    <div id="start-screen" class="screen">
        <h1>SUPER PLASTIC COLLECTOR</h1>
        
        <p>Collect accepted plastics! Avoid rejected waste!</p>

        <div class="preview-container">
            <div class="preview-box">
                <div class="preview-circle">
                    <svg width="28" height="28" viewBox="0 0 40 40">
                        <rect x="10" y="8" width="20" height="24" rx="3" fill="#4a90e2"/>
                        <path d="M14 8 C14 2, 26 2, 26 8" fill="none" stroke="#2a60a2" stroke-width="2"/>
                    </svg>
                </div>
                <div class="preview-label">Bag</div>
            </div>
            <div class="preview-box">
                <div class="preview-circle">
                    <svg width="28" height="28" viewBox="0 0 40 40">
                        <rect x="12" y="10" width="16" height="24" fill="#3498db" rx="2"/>
                        <rect x="15" y="4" width="10" height="6" fill="#2980b9"/>
                    </svg>
                </div>
                <div class="preview-label">Bottle</div>
            </div>
            <div class="preview-box">
                <div class="preview-circle">
                    <svg width="28" height="28" viewBox="0 0 40 40">
                        <rect x="8" y="12" width="24" height="20" fill="#f39c12" rx="2"/>
                    </svg>
                </div>
                <div class="preview-label">Snack</div>
            </div>
        </div>

        <button id="start-btn" class="btn">PLAY GAME</button>

        <div class="controls-hint">
            CONTROLS: Spacebar / Up Arrow / Tap Screen to Jump
        </div>
    </div>

    <!-- GAME OVER SCREEN -->
    <div id="end-screen" class="screen hidden">
        <h2>TIME'S UP!</h2>
        
        <div class="stats-box">
            <div class="stats-row">
                <span>Final Score:</span>
                <span id="res-score" style="color: #27AE60; font-weight: bold;">0</span>
            </div>
            <div class="stats-row">
                <span>Plastics Collected:</span>
                <span id="res-collected">0/0</span>
            </div>
            <div class="stats-row">
                <span>Mistakes Made:</span>
                <span id="res-mistakes" style="color: #C0392B;">0</span>
            </div>
        </div>

        <div class="did-you-know">
            <div class="did-you-know-title">[Did You Know?]</div>
            <div id="did-you-know-text">Clean plastic containers are accepted — just rinse them first!</div>
        </div>

        <button id="restart-btn" class="btn">PLAY AGAIN</button>
    </div>
</div>

<script>
// Web Audio API Sound Generator
const AudioCTX = new (window.AudioContext || window.webkitAudioContext)();

function playSound(type) {
    if (AudioCTX.state === 'suspended') {
        AudioCTX.resume();
    }
    const osc = AudioCTX.createOscillator();
    const gain = AudioCTX.createGain();
    osc.connect(gain);
    gain.connect(AudioCTX.destination);

    const now = AudioCTX.currentTime;

    if (type === 'coin') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
    } else if (type === 'error') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.linearRampToValueAtTime(110, now + 0.2);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.2);
    } else if (type === 'jump') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(400, now + 0.12);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
        osc.start(now);
        osc.stop(now + 0.12);
    }
}

// SVG Graphic Data Generator (Data URIs for photo-realistic items)
function createSvgDataUri(drawFunction) {
    const canvas = document.createElement('canvas');
    canvas.width = 40;
    canvas.height = 40;
    const ctx = canvas.getContext('2d');
    drawFunction(ctx);
    return canvas.toDataURL();
}

// Pre-render simulated real product photos onto canvas placeholders
const ITEM_DEFINITIONS = {
    // ACCEPTED (Collectibles)
    'bag': { name: 'Plastic Bag', type: 'collectible', color: '#4a90e2', draw: (ctx) => {
        ctx.fillStyle = '#e0f2fe'; ctx.fillRect(0,0,40,40);
        ctx.fillStyle = '#38bdf8'; ctx.beginPath(); ctx.roundRect(10, 12, 20, 22, 4); ctx.fill();
        ctx.strokeStyle = '#0284c7'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(20, 12, 6, Math.PI, 0); ctx.stroke();
    }},
    'bubble': { name: 'Bubble Wrap', type: 'collectible', color: '#e0e7ff', draw: (ctx) => {
        ctx.fillStyle = '#EEF2FF'; ctx.fillRect(0,0,40,40);
        ctx.fillStyle = '#C7D2FE';
        for(let x=8; x<=32; x+=8) for(let y=8; y<=32; y+=8) { ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI*2); ctx.fill(); }
    }},
    'cup': { name: 'Plastic Cup', type: 'collectible', color: '#67e8f9', draw: (ctx) => {
        ctx.fillStyle = '#CFFAFE'; ctx.fillRect(0,0,40,40);
        ctx.fillStyle = '#22D3EE'; ctx.beginPath(); ctx.moveTo(10,8); ctx.lineTo(30,8); ctx.lineTo(26,34); ctx.lineTo(14,34); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#A5F3FC'; ctx.fillRect(8, 6, 24, 3);
    }},
    'straw': { name: 'Plastic Straw', type: 'collectible', color: '#f43f5e', draw: (ctx) => {
        ctx.fillStyle = '#FFE4E6'; ctx.fillRect(0,0,40,40);
        ctx.strokeStyle = '#F43F5E'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(8,32); ctx.lineTo(24,16); ctx.lineTo(32,16); ctx.stroke();
    }},
    'wrapper': { name: 'Plastic Wrapper', type: 'collectible', color: '#f59e0b', draw: (ctx) => {
        ctx.fillStyle = '#FEF3C7'; ctx.fillRect(0,0,40,40);
        ctx.fillStyle = '#F59E0B'; ctx.beginPath(); ctx.moveTo(6,12); ctx.lineTo(34,12); ctx.lineTo(30,28); ctx.lineTo(10,28); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#D97706'; ctx.fillRect(4, 12, 4, 16); ctx.fillRect(32, 12, 4, 16);
    }},
    'packaging': { name: 'Plastic Packaging', type: 'collectible', color: '#38bdf8', draw: (ctx) => {
        ctx.fillStyle = '#E0F2FE'; ctx.fillRect(0,0,40,40);
        ctx.strokeStyle = '#0284C7'; ctx.lineWidth = 2; ctx.strokeRect(8,8,24,24);
        ctx.fillStyle = '#38BDF8'; ctx.fillRect(12,12,16,16);
    }},
    'styrofoam': { name: 'Styrofoam', type: 'collectible', color: '#f3f4f6', draw: (ctx) => {
        ctx.fillStyle = '#F3F4F6'; ctx.fillRect(0,0,40,40);
        ctx.fillStyle = '#E5E7EB'; ctx.fillRect(6,10,28,20);
        ctx.strokeStyle = '#D1D5DB'; ctx.lineWidth = 1; ctx.strokeRect(6,10,28,20);
    }},
    'utensils': { name: 'Plastic Utensils', type: 'collectible', color: '#e2e8f0', draw: (ctx) => {
        ctx.fillStyle = '#F1F5F9'; ctx.fillRect(0,0,40,40);
        ctx.fillStyle = '#94A3B8'; ctx.fillRect(14,6,3,28); ctx.fillRect(23,6,3,28); // Fork/Spoon handles
        ctx.beginPath(); ctx.arc(24.5, 9, 5, 0, Math.PI*2); ctx.fill();
    }},
    'container': { name: 'Plastic Container', type: 'collectible', color: '#a7f3d0', draw: (ctx) => {
        ctx.fillStyle = '#ECFDF5'; ctx.fillRect(0,0,40,40);
        ctx.fillStyle = '#10B981'; ctx.fillRect(8,16,24,16);
        ctx.fillStyle = '#059669'; ctx.fillRect(6,12,28,4); // lid
    }},
    'snack': { name: 'Snack Packaging', type: 'collectible', color: '#ec4899', draw: (ctx) => {
        ctx.fillStyle = '#FCE7F3'; ctx.fillRect(0,0,40,40);
        ctx.fillStyle = '#EC4899'; ctx.fillRect(8,8,24,24);
        ctx.fillStyle = '#F59E0B'; ctx.beginPath(); ctx.arc(20,20,6,0,Math.PI*2); ctx.fill();
    }},
    'bottle': { name: 'Plastic Bottle', type: 'collectible', color: '#60a5fa', draw: (ctx) => {
        ctx.fillStyle = '#EFF6FF'; ctx.fillRect(0,0,40,40);
        ctx.fillStyle = '#3B82F6'; ctx.fillRect(12,14,16,20);
        ctx.fillStyle = '#1D4ED8'; ctx.fillRect(16,6,8,8); ctx.fillRect(14,4,12,3); // Cap
    }},
    'hard_container': { name: 'Hard Container', type: 'collectible', color: '#34d399', draw: (ctx) => {
        ctx.fillStyle = '#D1FAE5'; ctx.fillRect(0,0,40,40);
        ctx.fillStyle = '#059669'; ctx.roundRect(8,10,24,22,4); ctx.fill();
        ctx.fillStyle = '#047857'; ctx.fillRect(12,6,16,4);
    }},
    'hard_bottle': { name: 'Hard Bottle', type: 'collectible', color: '#2dd4bf', draw: (ctx) => {
        ctx.fillStyle = '#CCFBF1'; ctx.fillRect(0,0,40,40);
        ctx.fillStyle = '#0D9488'; ctx.fillRect(10,12,20,22);
        ctx.fillStyle = '#115E59'; ctx.fillRect(15,4,10,8);
    }},

    // REJECTED (Obstacles)
    'dirty_plastic': { name: 'Dirty Plastic', type: 'obstacle', color: '#78350f', draw: (ctx) => {
        ctx.fillStyle = '#FEF3C7'; ctx.fillRect(0,0,40,40);
        ctx.fillStyle = '#38BDF8'; ctx.fillRect(8,8,24,24);
        ctx.fillStyle = '#78350F'; ctx.beginPath(); ctx.arc(16,18,6,0,Math.PI*2); ctx.arc(26,24,8,0,Math.PI*2); ctx.fill();
    }},
    'paper': { name: 'Paper', type: 'obstacle', color: '#fef08a', draw: (ctx) => {
        ctx.fillStyle = '#FEF9C3'; ctx.fillRect(0,0,40,40);
        ctx.fillStyle = '#FFFFFF'; ctx.fillRect(10,6,20,28);
        ctx.strokeStyle = '#CA8A04'; ctx.lineWidth = 1; ctx.strokeRect(10,6,20,28);
        ctx.fillStyle = '#EAB308'; ctx.fillRect(14,12,12,2); ctx.fillRect(14,18,12,2); ctx.fillRect(14,24,8,2);
    }},
    'cardboard': { name: 'Cardboard', type: 'obstacle', color: '#b45309', draw: (ctx) => {
        ctx.fillStyle = '#FFEDD5'; ctx.fillRect(0,0,40,40);
        ctx.fillStyle = '#D97706'; ctx.fillRect(6,10,28,20);
        ctx.strokeStyle = '#92400E'; ctx.lineWidth = 2; ctx.strokeRect(6,10,28,20);
        ctx.beginPath(); ctx.moveTo(6,10); ctx.lineTo(34,30); ctx.stroke();
    }},
    'glass': { name: 'Glass Bottle', type: 'obstacle', color: '#15803d', draw: (ctx) => {
        ctx.fillStyle = '#DCFCE7'; ctx.fillRect(0,0,40,40);
        ctx.fillStyle = '#15803D'; ctx.fillRect(14,14,12,20); ctx.fillRect(17,6,6,8);
    }},
    'battery': { name: 'Battery', type: 'obstacle', color: '#dc2626', draw: (ctx) => {
        ctx.fillStyle = '#FEE2E2'; ctx.fillRect(0,0,40,40);
        ctx.fillStyle = '#111827'; ctx.fillRect(12,10,16,24);
        ctx.fillStyle = '#DC2626'; ctx.fillRect(12,10,16,10);
        ctx.fillStyle = '#9CA3AF'; ctx.fillRect(17,6,6,4);
    }},
    'food_waste': { name: 'Food Waste', type: 'obstacle', color: '#65a30d', draw: (ctx) => {
        ctx.fillStyle = '#ECFCCB'; ctx.fillRect(0,0,40,40);
        ctx.fillStyle = '#65A30D'; ctx.beginPath(); ctx.arc(20,22,12,0,Math.PI*2); ctx.fill();
        ctx.fillStyle = '#4D7C0F'; ctx.beginPath(); ctx.arc(16,18,4,0,Math.PI*2); ctx.fill();
    }},
    'metal_can': { name: 'Metal Can', type: 'obstacle', color: '#94a3b8', draw: (ctx) => {
        ctx.fillStyle = '#F1F5F9'; ctx.fillRect(0,0,40,40);
        ctx.fillStyle = '#94A3B8'; ctx.fillRect(12,8,16,24);
        ctx.fillStyle = '#64748B'; ctx.fillRect(12,8,16,3); ctx.fillRect(12,29,16,3);
    }},
    'tetrapak': { name: 'Tetra Pak', type: 'obstacle', color: '#ea580c', draw: (ctx) => {
        ctx.fillStyle = '#FFEDD5'; ctx.fillRect(0,0,40,40);
        ctx.fillStyle = '#EA580C'; ctx.fillRect(10,10,20,24);
        ctx.fillStyle = '#2563EB'; ctx.beginPath(); ctx.moveTo(10,10); ctx.lineTo(20,4); ctx.lineTo(30,10); ctx.closePath(); ctx.fill();
    }},
    'ceramic': { name: 'Ceramic Plate', type: 'obstacle', color: '#e2e8f0', draw: (ctx) => {
        ctx.fillStyle = '#F8FAFC'; ctx.fillRect(0,0,40,40);
        ctx.fillStyle = '#E2E8F0'; ctx.beginPath(); ctx.arc(20,20,14,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#94A3B8'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(20,20,10,0,Math.PI*2); ctx.stroke();
    }},
    'fabric': { name: 'Fabric/Cloth', type: 'obstacle', color: '#a855f7', draw: (ctx) => {
        ctx.fillStyle = '#FAF5FF'; ctx.fillRect(0,0,40,40);
        ctx.fillStyle = '#A855F7'; ctx.beginPath(); ctx.roundRect(8,10,24,20,6); ctx.fill();
        ctx.strokeStyle = '#7E22CE'; ctx.lineWidth = 2; ctx.strokeRect(12,14,16,12);
    }}
};

// Generate Data URIs for items
const ITEM_IMAGES = {};
Object.keys(ITEM_DEFINITIONS).forEach(key => {
    ITEM_IMAGES[key] = createSvgDataUri(ITEM_DEFINITIONS[key].draw);
});

const EDUCATIONAL_TIPS = [
    "Clean plastic containers are accepted — just rinse them first!",
    "Styrofoam might surprise you, but we accept it here!",
    "No dirty plastics please — a quick rinse is all it takes.",
    "Paper and cardboard have their own recycling stream, not here.",
    "Hard plastic bottles need caps removed before collection.",
    "Plastic bags and wrappers go in the Green Net Bag at our Zero Waste booth!"
];

// Game Canvas & Context
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Game State Variables
let gameState = 'START'; // 'START', 'PLAYING', 'END'
let score = 0;
let timer = 60;
let timerInterval = null;
let plasticsCollected = 0;
let totalCollectiblesSpawned = 0;
let mistakesMade = 0;
let gameFrame = 0;

// Physics / Speed variables
let currentSpeed = 3; // 3px, 4.5px, 6px
let spawnInterval = 1.5; // seconds
let lastSpawnTime = 0;

// Player Setup
const player = {
    x: 100,
    y: 330,
    width: 36,
    height: 48,
    velocityY: 0,
    gravity: 0.6,
    jumpStrength: -11.5,
    isGrounded: false,
    stunned: false,
    stunTimer: 0,
    
    reset() {
        this.x = 100;
        this.y = 330;
        this.velocityY = 0;
        this.isGrounded = true;
        this.stunned = false;
        this.stunTimer = 0;
    },

    jump() {
        if (this.isGrounded && !this.stunned) {
            this.velocityY = this.jumpStrength;
            this.isGrounded = false;
            playSound('jump');
        }
    },

    update() {
        if (this.stunned) {
            this.stunTimer--;
            if (this.stunTimer <= 0) this.stunned = false;
        }

        this.velocityY += this.gravity;
        this.y += this.velocityY;

        // Collision with Ground & Platforms
        const groundY = 330; // Player bottom at ground level
        let targetY = groundY;

        // Check platform landing (Platform is around Y: 220, x range check)
        platforms.forEach(p => {
            if (player.x + player.width > p.x && player.x < p.x + p.width) {
                if (player.y + player.height <= p.y + 12 && player.y + player.height + player.velocityY >= p.y) {
                    targetY = p.y - player.height;
                }
            }
        });

        if (this.y >= targetY) {
            this.y = targetY;
            this.velocityY = 0;
            this.isGrounded = true;
        }
    },

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        if (this.stunned && Math.floor(gameFrame / 4) % 2 === 0) {
            ctx.globalAlpha = 0.5; // Flash effect when stunned
        }

        // Draw Pixel Avatar Character
        // Head
        ctx.fillStyle = '#FFCC99';
        ctx.fillRect(8, 4, 20, 16);

        // Eyes
        ctx.fillStyle = '#2D3436';
        ctx.fillRect(22, 8, 4, 4);

        // Cap / Hair
        ctx.fillStyle = '#2D3436';
        ctx.fillRect(6, 2, 24, 4);

        // Body / Green Apron
        ctx.fillStyle = '#FF8C42'; // Shirt
        ctx.fillRect(6, 20, 24, 18);

        ctx.fillStyle = '#7BC950'; // Apron
        ctx.fillRect(8, 22, 20, 18);

        // Recycle Symbol on Apron (Yellow)
        ctx.fillStyle = '#FFD700';
        ctx.font = '10px sans-serif';
        ctx.fillText('♻', 13, 34);

        // Legs / Running animation
        ctx.fillStyle = '#2D3436';
        if (this.isGrounded) {
            const legOffset = Math.sin(gameFrame * 0.3) * 6;
            ctx.fillRect(10 + legOffset, 38, 6, 10);
            ctx.fillRect(20 - legOffset, 38, 6, 10);
        } else {
            // Jump pose
            ctx.fillRect(8, 38, 6, 6);
            ctx.fillRect(22, 36, 6, 8);
        }

        ctx.restore();
    }
};

// World Platforms & Environment
let platforms = [];
let items = [];
let floatingTexts = [];

class Item {
    constructor(key, lane) {
        this.key = key;
        this.info = ITEM_DEFINITIONS[key];
        this.x = 820;
        this.width = 40;
        this.height = 40;
        this.lane = lane; // 'ground' or 'elevated'
        this.y = (lane === 'elevated') ? 180 : 338;
        this.img = new Image();
        this.img.src = ITEM_IMAGES[key];
        this.collected = false;
    }

    update() {
        this.x -= currentSpeed;
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        // Outer Glow Container
        const isCollectible = this.info.type === 'collectible';
        ctx.beginPath();
        ctx.arc(20, 20, 22, 0, Math.PI * 2);
        
        if (isCollectible) {
            ctx.fillStyle = '#FFFFFF';
            ctx.fill();
            ctx.strokeStyle = '#7BC950';
            ctx.lineWidth = 3;
            ctx.shadowColor = '#7BC950';
            ctx.shadowBlur = 8;
            ctx.stroke();
        } else {
            ctx.fillStyle = '#FFFFFF';
            ctx.fill();
            ctx.strokeStyle = '#FF6B6B';
            ctx.lineWidth = 3;
            ctx.shadowColor = '#FF6B6B';
            // Pulsing red glow
            ctx.shadowBlur = 6 + Math.sin(gameFrame * 0.2) * 4;
            ctx.stroke();
        }

        // Clip Image Inside Circle Frame
        ctx.shadowBlur = 0; // reset shadow
        ctx.save();
        ctx.beginPath();
        ctx.arc(20, 20, 19, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(this.img, 0, 0, 40, 40);
        ctx.restore();

        // Small Name Label Below
        ctx.fillStyle = '#2D3436';
        ctx.font = '7px "Press Start 2P"';
        ctx.textAlign = 'center';
        
        // Background for label text for readability
        const textWidth = ctx.measureText(this.info.name).width;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.fillRect(20 - textWidth/2 - 2, 44, textWidth + 4, 10);

        ctx.fillStyle = isCollectible ? '#27AE60' : '#C0392B';
        ctx.fillText(this.info.name, 20, 51);

        ctx.restore();
    }
}

class FloatingText {
    constructor(text, x, y, color) {
        this.text = text;
        this.x = x;
        this.y = y;
        this.color = color;
        this.alpha = 1.0;
        this.life = 40;
    }

    update() {
        this.y -= 1;
        this.alpha -= 0.025;
        this.life--;
    }

    draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fillStyle = this.color;
        ctx.font = '12px "Press Start 2P"';
        ctx.fillText(this.text, this.x, this.y);
        ctx.restore();
    }
}

// Background & Scrolling
let bgOffset = 0;

function updateEnvironment() {
    bgOffset = (bgOffset + currentSpeed * 0.5) % 800;

    // Platform spawning & moving logic
    if (platforms.length === 0 || platforms[platforms.length - 1].x < 800 - 300) {
        if (Math.random() > 0.4) {
            platforms.push({
                x: 800,
                y: 230,
                width: 140,
                height: 16
            });
        }
    }

    platforms.forEach(p => p.x -= currentSpeed);
    platforms = platforms.filter(p => p.x + p.width > -50);
}

function drawBackground() {
    // Sky
    ctx.fillStyle = '#5BC0EB';
    ctx.fillRect(0, 0, 800, 450);

    // Clouds
    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
    ctx.beginPath();
    ctx.arc(100 - (bgOffset * 0.2) % 900 + 100, 80, 25, 0, Math.PI * 2);
    ctx.arc(130 - (bgOffset * 0.2) % 900 + 100, 70, 35, 0, Math.PI * 2);
    ctx.arc(160 - (bgOffset * 0.2) % 900 + 100, 80, 25, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(500 - (bgOffset * 0.2) % 900 + 100, 120, 20, 0, Math.PI * 2);
    ctx.arc(525 - (bgOffset * 0.2) % 900 + 100, 110, 30, 0, Math.PI * 2);
    ctx.arc(550 - (bgOffset * 0.2) % 900 + 100, 120, 20, 0, Math.PI * 2);
    ctx.fill();

    // Ground Base
    ctx.fillStyle = '#7BC950';
    ctx.fillRect(0, 378, 800, 72);

    // Ground Details / Tiles
    ctx.fillStyle = '#5A9A3C';
    ctx.fillRect(0, 378, 800, 8);
    for (let x = -bgOffset % 40; x < 800; x += 40) {
        ctx.fillRect(x, 390, 20, 6);
        ctx.fillRect(x + 20, 410, 12, 6);
    }

    // Elevated Platforms
    platforms.forEach(p => {
        ctx.fillStyle = '#5A9A3C';
        ctx.fillRect(p.x, p.y, p.width, p.height);
        ctx.fillStyle = '#7BC950';
        ctx.fillRect(p.x, p.y, p.width, 4);
    });
}

// Spawning Logic
let lastSpawnedTypeWasObstacle = false;

function spawnItem() {
    const now = Date.now() / 1000;
    if (now - lastSpawnTime < spawnInterval) return;

    // Check minimum 200px gap
    if (items.length > 0) {
        const lastItem = items[items.length - 1];
        if (800 - lastItem.x < 200) return;
    }

    // Determine type (60% collectible, 40% obstacle, no 2 consecutive obstacles)
    let isObstacle = Math.random() < 0.4;
    if (lastSpawnedTypeWasObstacle) {
        isObstacle = false;
    }

    const collectiblesKeys = Object.keys(ITEM_DEFINITIONS).filter(k => ITEM_DEFINITIONS[k].type === 'collectible');
    const obstacleKeys = Object.keys(ITEM_DEFINITIONS).filter(k => ITEM_DEFINITIONS[k].type === 'obstacle');

    let key;
    if (isObstacle) {
        key = obstacleKeys[Math.floor(Math.random() * obstacleKeys.length)];
        lastSpawnedTypeWasObstacle = true;
    } else {
        key = collectiblesKeys[Math.floor(Math.random() * collectiblesKeys.length)];
        lastSpawnedTypeWasObstacle = false;
        totalCollectiblesSpawned++;
    }

    // Determine lane: elevated platform or ground
    let lane = 'ground';
    const activePlatform = platforms.find(p => p.x > 500 && p.x < 750);
    if (activePlatform && Math.random() > 0.5) {
        lane = 'elevated';
    }

    items.push(new Item(key, lane));
    lastSpawnTime = now;
}

// Collision Detection
function checkCollisions() {
    items.forEach((item, index) => {
        if (item.collected) return;

        // AABB Collision Test
        if (
            player.x < item.x + item.width &&
            player.x + player.width > item.x &&
            player.y < item.y + item.height &&
            player.y + player.height > item.y
        ) {
            item.collected = true;

            if (item.info.type === 'collectible') {
                score += 10;
                plasticsCollected++;
                playSound('coin');
                floatingTexts.push(new FloatingText('+10', item.x, item.y, '#27AE60'));
            } else {
                score = Math.max(0, score - 5);
                mistakesMade++;
                player.stunned = true;
                player.stunTimer = 18; // ~0.3s at 60fps
                playSound('error');
                floatingTexts.push(new FloatingText('-5', item.x, item.y, '#C0392B'));
            }
        }
    });

    // Remove offscreen or collected items
    items = items.filter(item => item.x > -60 && !item.collected);
}

// Draw UI
function drawUI() {
    // Top Bar Container
    ctx.fillStyle = '#FFFFFF';
    ctx.strokeStyle = '#2D3436';
    ctx.lineWidth = 3;

    // Score Box
    ctx.fillRect(15, 12, 160, 36);
    ctx.strokeRect(15, 12, 160, 36);

    ctx.fillStyle = '#FFD700';
    ctx.font = '16px "Press Start 2P"';
    ctx.fillText('★', 25, 36);

    ctx.fillStyle = '#2D3436';
    ctx.font = '11px "Press Start 2P"';
    ctx.fillText(`SCORE:${score}`, 48, 35);

    // Timer Box
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(640, 12, 145, 36);
    ctx.strokeRect(640, 12, 145, 36);

    // Red pulsing timer under 10s
    if (timer <= 10) {
        ctx.fillStyle = Math.floor(gameFrame / 15) % 2 === 0 ? '#FF6B6B' : '#2D3436';
    } else {
        ctx.fillStyle = '#2D3436';
    }
    ctx.font = '11px "Press Start 2P"';
    ctx.fillText(`TIME:${timer}s`, 652, 35);
}

// Game Loop
function gameLoop() {
    if (gameState !== 'PLAYING') return;

    gameFrame++;

    // Update Difficulty Tiers based on timer
    if (timer > 40) {
        currentSpeed = 3.0;
        spawnInterval = 1.5;
    } else if (timer > 20) {
        currentSpeed = 4.5;
        spawnInterval = 1.2;
    } else {
        currentSpeed = 6.0;
        spawnInterval = 1.0;
    }

    // Updates
    updateEnvironment();
    player.update();
    spawnItem();

    items.forEach(item => item.update());
    floatingTexts.forEach(ft => ft.update());
    floatingTexts = floatingTexts.filter(ft => ft.life > 0);

    checkCollisions();

    // Render
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawBackground();
    
    items.forEach(item => item.draw());
    player.draw();
    floatingTexts.forEach(ft => ft.draw());

    drawUI();

    requestAnimationFrame(gameLoop);
}

// Timer Controller
function startTimer() {
    clearInterval(timerInterval);
    timer = 60;
    timerInterval = setInterval(() => {
        if (gameState === 'PLAYING') {
            timer--;
            if (timer <= 0) {
                endGame();
            }
        }
    }, 1000);
}

// Start Game
function startGame() {
    gameState = 'PLAYING';
    score = 0;
    plasticsCollected = 0;
    totalCollectiblesSpawned = 0;
    mistakesMade = 0;
    items = [];
    floatingTexts = [];
    platforms = [];
    player.reset();

    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('end-screen').classList.add('hidden');

    startTimer();
    requestAnimationFrame(gameLoop);
}

// End Game
function endGame() {
    gameState = 'END';
    clearInterval(timerInterval);

    document.getElementById('res-score').innerText = score;
    document.getElementById('res-collected').innerText = `${plasticsCollected}/${totalCollectiblesSpawned}`;
    document.getElementById('res-mistakes').innerText = mistakesMade;

    // Pick random educational tip
    const randomTip = EDUCATIONAL_TIPS[Math.floor(Math.random() * EDUCATIONAL_TIPS.length)];
    document.getElementById('did-you-know-text').innerText = randomTip;

    document.getElementById('end-screen').classList.remove('hidden');
}

// Input Handlers
function handleJump() {
    if (gameState === 'PLAYING') {
        player.jump();
    }
}

window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        handleJump();
    }
});

canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    handleJump();
});

canvas.addEventListener('mousedown', (e) => {
    handleJump();
});

// Button Click Listeners
document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', startGame);

// Initial Canvas Clear
ctx.fillStyle = '#5BC0EB';
ctx.fillRect(0, 0, canvas.width, canvas.height);

</script>
